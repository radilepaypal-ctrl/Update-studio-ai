name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Google Timeline Visualizer.

        Issues are for reproducible bugs. For lightweight opinions, comments, questions, or general feedback, please use [GitHub Discussions](https://github.com/mahlernim/google-timeline-visualizer/discussions). Short and informal posts are welcome there.

        Please do not upload your Google Timeline export or include precise locations, home or work addresses, account details, or other personal information.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the problem occur?
      options:
        - Android app
        - Web app
        - Both Android and web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or web browser
      description: For Android, provide the app version. For web, provide the browser name and version.
      placeholder: "Android 2.2.5, or Chrome 140"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its visible effect.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reliably shows the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add screenshots, error messages, or other useful details after removing personal information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: I removed precise locations, account details, and other personal information from this report and its attachments.
          required: true
