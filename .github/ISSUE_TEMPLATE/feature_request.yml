name: Feature request
description: Propose a concrete new feature or behavior change
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Google Timeline Visualizer.

        Issues are for concrete feature requests with a clear user need. For lightweight opinions, comments, questions, or early ideas, please use [GitHub Discussions](https://github.com/mahlernim/google-timeline-visualizer/discussions). Short and informal posts are welcome there.

        Please do not upload your Google Timeline export or include precise locations, home or work addresses, account details, or other personal information.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which part of the project would this improve?
      options:
        - Android app
        - Web app
        - Both Android and web
        - Project documentation or distribution
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Explain the problem this request would solve and who experiences it.
      placeholder: Describe the current limitation without relying only on the proposed solution.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe what users should be able to do and how success could be verified.
      placeholder: A user should be able to ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related links after removing personal information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for the same request.
          required: true
        - label: This request describes a concrete user need rather than only a lightweight opinion or comment.
          required: true
        - label: I removed precise locations, account details, and other personal information from this request and its attachments.
          required: true
