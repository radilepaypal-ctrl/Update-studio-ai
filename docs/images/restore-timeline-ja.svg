<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Google マップのタイムラインを復元する4段階</title>
  <desc id="desc">タイムラインを開き、雲アイコンを選び、元の端末のその他メニューからインポートして確認します。</desc>
  <rect width="960" height="300" rx="28" fill="#faf5fb"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" text-anchor="middle" fill="#241f26">
    <g transform="translate(30 24)"><rect width="210" height="252" rx="24" fill="#fff" stroke="#ddd4df" stroke-width="2"/><circle cx="105" cy="75" r="30" fill="#efe4ff" stroke="#745b7d" stroke-width="3"/><circle cx="105" cy="67" r="9" fill="#745b7d"/><path d="M87 91c5-13 31-13 36 0" fill="#745b7d"/><text x="105" y="130" font-size="15" fill="#6b626d">1</text><text x="105" y="166" font-size="20" font-weight="700">タイムライン</text><text x="105" y="199" font-size="15" fill="#5d555f">プロフィール</text></g>
    <g transform="translate(260 24)"><rect width="210" height="252" rx="24" fill="#fff" stroke="#ddd4df" stroke-width="2"/><path d="M67 91h82c17 0 21-25 5-31-4-19-31-23-41-8-17-10-38 3-36 21-18 2-18 18-10 18z" fill="#efe4ff" stroke="#745b7d" stroke-width="3"/><text x="105" y="130" font-size="15" fill="#6b626d">2</text><text x="105" y="166" font-size="20" font-weight="700">雲アイコン</text><text x="105" y="199" font-size="15" fill="#5d555f">バックアップ</text></g>
    <g transform="translate(490 24)"><rect width="210" height="252" rx="24" fill="#fff" stroke="#ddd4df" stroke-width="2"/><rect x="75" y="42" width="60" height="76" rx="9" fill="#efe4ff" stroke="#745b7d" stroke-width="3"/><circle cx="105" cy="106" r="3" fill="#745b7d"/><text x="164" y="80" font-size="28" fill="#745b7d">⋮</text><text x="105" y="144" font-size="15" fill="#6b626d">3</text><text x="105" y="180" font-size="19" font-weight="700">元のデバイス</text><text x="105" y="213" font-size="15" fill="#5d555f">その他</text></g>
    <g transform="translate(720 24)"><rect width="210" height="252" rx="24" fill="#fff" stroke="#ddd4df" stroke-width="2"/><circle cx="105" cy="78" r="38" fill="#ff006e"/><path d="M105 51v43m-18-17 18 18 18-18" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="138" font-size="15" fill="#6b626d">4</text><text x="105" y="174" font-size="19" font-weight="700">インポート</text><text x="105" y="207" font-size="15" fill="#5d555f">確認する</text></g>
  </g>
  <g fill="none" stroke="#ff006e" stroke-width="4" stroke-linecap="round"><path d="M242 150h14m-6-7 7 7-7 7"/><path d="M472 150h14m-6-7 7 7-7 7"/><path d="M702 150h14m-6-7 7 7-7 7"/></g>
</svg>
